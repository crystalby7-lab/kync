<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Kync — 대화 유형 검사</title>
  <meta name="theme-color" content="#F4F1EC" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="kync.css?v=20261019-4" />
</head>
<body>
<div class="sub-app">
  <header class="sub-head">
    <button class="icon-btn" onclick="goHome()" aria-label="활동으로 돌아가기"><span data-ic="back"></span></button>
    <h1>대화 유형 검사</h1>
  </header>

  <!-- 역할 선택 -->
  <div class="sub-body qs-step" id="s-role">
    <div class="sub-intro">
      <h2>나는 어떻게 말하는 사람일까?</h2>
      <p id="intro-sub"></p>
    </div>
    <button class="btn btn-primary btn-block" id="start-btn" onclick="Quiz.start(localStorage.getItem('kync_role') === 'child' ? 'child' : 'parent')">시작</button>
  </div>

  <!-- 질문 -->
  <div class="sub-body qs-step hidden" id="s-quiz">
    <div class="quiz-prog">
      <div class="bar"><div id="q-prog-bar" style="width:5%"></div></div>
      <span id="q-prog-text">1 / 20</span>
    </div>
    <div class="dark-card">
      <div class="q-label" id="q-axis-pill"></div>
      <p class="q-text" id="q-text"></p>
    </div>
    <div class="opt-list" id="q-opts"></div>
    <div class="quiz-nav">
      <button class="btn btn-soft" id="btn-prev" onclick="Quiz.prev()" disabled>이전</button>
      <button class="btn btn-primary" id="btn-next" onclick="Quiz.next()" disabled>다음</button>
    </div>
  </div>

  <!-- 결과 -->
  <div class="sub-body qs-step hidden" id="s-result">
    <div class="result-hero">
      <div class="r-eyebrow" id="r-eyebrow">대화 유형 결과</div>
      <div class="r-type-name" id="r-type-name"></div>
      <div class="r-type-sub" id="r-type-sub"></div>
      <p class="r-summary" id="r-summary"></p>
    </div>
    <section class="card">
      <div class="card-head"><h2>4가지 기준</h2></div>
      <div id="axes-display"></div>
    </section>
    <section class="card hidden" id="r-family"></section>
    <section class="card" id="r-detail-card"></section>
    <section class="card">
      <div class="card-head"><h2>해볼 만한 것</h2></div>
      <div id="r-tips"></div>
    </section>
    <section class="card">
      <div class="card-head"><h2>다른 유형이랑은</h2></div>
      <div id="r-compat"></div>
    </section>
    <button class="btn btn-primary btn-block" onclick="Quiz.saveAndGoHome()">활동으로</button>
    <button class="btn btn-soft btn-block" onclick="Quiz.reset()">다시 하기</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="kync-ui.js?v=20261019-4"></script>
<script src="firebase-system.js?v=20261019-4"></script>
<script>
KyncAuth.onAuthChange(user => { if (!user) location.href = 'index.html'; });
function goHome(){ Quiz.saveAndGoHome(); }
document.addEventListener('DOMContentLoaded', () => { const el = document.getElementById('intro-sub'); if (el) el.textContent = tone('20문항, 5분쯤 걸려요. 정답은 없으니 평소 모습에 가까운 걸 고르면 돼요.', '20문항, 5분쯤 걸려. 정답 없으니까 평소 나랑 가까운 걸 고르면 돼.'); });
</script>
<script src="quiz.js?v=20261019-4"></script>
</body>
</html>
