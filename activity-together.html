<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Kync — 밸런스 게임</title>
  <meta name="theme-color" content="#F4F1EC" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="kync.css?v=20261012-6" />
</head>
<body>
<div class="sub-app">
  <header class="sub-head">
    <button class="icon-btn" onclick="goBack()" aria-label="활동으로 돌아가기"><span data-ic="back"></span></button>
    <h1>밸런스 게임</h1>
  </header>
  <main class="sub-body">
    <div class="sub-intro">
      <h2>오늘의 밸런스 게임</h2>
      <p>각자 고르고, 둘 다 고르면 서로의 답이 보여요.</p>
    </div>
    <div class="dark-card">
      <div class="q-label">오늘의 질문</div>
      <p class="q-text" id="q-text"></p>
    </div>
    <div id="game-ui" class="stack"></div>
    <p class="small muted center">질문은 매일 자정에 바뀌어요.</p>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="kync-ui.js?v=20261012-6"></script>
<script src="firebase-system.js?v=20261012-6"></script>
<script src="kync-features.js?v=20261012-6"></script>
<script>
  const myRole = localStorage.getItem('kync_role') || 'parent';
  const familyCode = localStorage.getItem('kync_family_code') || 'local';
  const balanceDay = new Date().toLocaleDateString('ko-KR');
  const storageKey = `kync_vs_${familyCode}_${balanceDay}`;
  const q = KyncTogether.BALANCE_Q[localDayNum() % KyncTogether.BALANCE_Q.length];
  const theirRole = myRole === 'parent' ? 'child' : 'parent';
  const theirLabel = myRole === 'parent' ? '자녀' : '부모님';
  const esc = KyncUI.esc;

  function goBack() {
    location.href = `index.html?tab=${myRole === 'parent' ? 'p-activityTab' : 'c-activityTab'}`;
  }
  function getSaved() {
    try { return JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (e) { return {}; }
  }

  function render() {
    document.getElementById('q-text').textContent = q.q;
    const saved = getSaved();
    const mine = saved[myRole], theirs = saved[theirRole];
    const ui = document.getElementById('game-ui');

    if (!mine) {
      ui.innerHTML = `<div class="opt-row">${q.opts.map(o =>
        `<button class="opt-big" data-opt="${esc(o)}" onclick="answer(this.dataset.opt)">${esc(o)}</button>`).join('')}</div>`;
      return;
    }
    ui.innerHTML = `
      <div class="kv"><small>나의 선택</small><b>${esc(mine)}</b></div>
      ${theirs ? `
        <div class="kv dark"><small>${theirLabel}의 선택</small><b>${esc(theirs)}</b></div>
        <div class="verdict ${mine === theirs ? 'same' : 'diff'}">
          ${KyncBrand.mascot(mine === theirs ? 'happy' : 'wow', 40, { shadow: false })}
          ${mine === theirs ? '같은 생각이에요' : '서로 다르게 생각했어요. 이유를 물어볼까요?'}
        </div>` : `
        <div class="waiting">${KyncBrand.curled(40)}<span><b>${theirLabel}의 선택을 기다리는 중</b>${theirLabel}도 고르면 결과가 열려요.</span></div>`}`;
  }

  async function answer(opt) {
    const saved = getSaved();
    saved[myRole] = opt;
    localStorage.setItem(storageKey, JSON.stringify(saved));
    render();
    if (familyCode !== 'local') {
      try {
        await db.collection('families').doc(familyCode).collection('balance').doc(balanceDay)
          .set({ [myRole]: opt }, { merge: true });
      } catch (e) { toast('저장하지 못했어요. 인터넷 연결을 확인해주세요.', 'error'); }
    }
  }

  render();

  // 상대 선택 실시간 반영
  if (familyCode !== 'local') {
    KyncAuth.ready().then(user => {
      if (!user) { location.href = 'index.html'; return; }
      db.collection('families').doc(familyCode).collection('balance').doc(balanceDay)
        .onSnapshot(snap => {
          const data = snap.data() || {};
          const s = getSaved();
          let changed = false;
          ['parent', 'child'].forEach(r => { if (data[r] && s[r] !== data[r]) { s[r] = data[r]; changed = true; } });
          if (changed) { localStorage.setItem(storageKey, JSON.stringify(s)); render(); }
        }, e => console.warn('balance listen:', e));
    });
  }
</script>
</body>
</html>
