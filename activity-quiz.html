<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Kync — 서로 맞히기</title>
  <meta name="theme-color" content="#F4F1EC" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="kync.css?v=20261013-4" />
</head>
<body>
<div class="sub-app">
  <header class="sub-head">
    <button class="icon-btn" onclick="goBack()" aria-label="활동으로 돌아가기"><span data-ic="back"></span></button>
    <h1>서로 맞히기</h1>
  </header>
  <main class="sub-body">
    <div class="stepper" id="stepper" aria-label="진행 단계"></div>
    <div class="dark-card">
      <div class="q-label" id="q-sub"></div>
      <p class="q-text" id="q-text"></p>
    </div>
    <div id="step-ui" class="stack"></div>
    <p class="small muted center" id="foot-note"></p>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="kync-ui.js?v=20261013-4"></script>
<script src="firebase-system.js?v=20261013-4"></script>
<script src="kync-features.js?v=20261013-4"></script>
<script>
  const myRole = localStorage.getItem('kync_role') || 'parent';
  const theirRole = myRole === 'parent' ? 'child' : 'parent';
  const familyCode = localStorage.getItem('kync_family_code') || 'local';
  const period = Math.floor(localDayNum() / 3);
  const qIdx = period % KyncTogether.QUIZ_Q.length;
  const q = KyncTogether.QUIZ_Q[qIdx];
  const storageKey = `kync_quiz_${familyCode}_p${period}`;
  const theirLabel = myRole === 'parent' ? '자녀' : '부모님';
  const esc = KyncUI.esc;
  // 띄어쓰기·문장부호 무시, 한쪽이 다른 쪽을 포함하면 맞은 걸로
  const norm = v => String(v ?? '').toLowerCase().replace(/[\s.,!?~'"()\-]/g, '');
  const close = (a, b) => { a = norm(a); b = norm(b); if (!a || !b) return false; return a === b || (Math.min(a.length, b.length) >= 2 && (a.includes(b) || b.includes(a))); };

  function goBack() {
    location.href = `index.html?tab=${myRole === 'parent' ? 'p-activityTab' : 'c-activityTab'}`;
  }
  function getSaved() {
    try { return JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (e) { return {}; }
  }
  function put(data) {
    localStorage.setItem(storageKey, JSON.stringify({ ...getSaved(), ...data }));
    render();
    if (familyCode === 'local') return;
    db.collection('families').doc(familyCode).collection('together_quiz').doc(storageKey).set({ ...data, q: q.q }, { merge: true })
      .catch(() => toast(tone('저장하지 못했어요. 인터넷 연결을 확인해주세요.', '저장 못 했어. 인터넷 연결 확인해줘'), 'error'));
  }

  function renderStepper(step) {
    const labels = ['내 답', `${theirLabel} 맞히기`, '결과'];
    document.getElementById('stepper').innerHTML = labels.map((l, i) => {
      const n = i + 1, cls = n < step ? 'done' : n === step ? 'on' : '';
      return `${i ? '<span class="line"></span>' : ''}<span class="s ${cls}"><i>${n < step ? ic('check', 13) : n}</i>${l}</span>`;
    }).join('');
  }

  function inputUI(kind) {
    const fn = kind === 'self' ? 'answerSelf' : 'answerGuess';
    if (q.opts) {
      return `<div class="opt-list">${q.opts.map((o, i) =>
        `<button class="opt-item" data-opt="${esc(o)}" onclick="${fn}(this.dataset.opt)"><span class="n">${i + 1}</span>${esc(o)}</button>`).join('')}</div>`;
    }
    return `<input id="${kind}-input" class="input" type="text" maxlength="20" aria-label="답"
        placeholder="${kind === 'self' ? tone('내 답', '내 답') : tone(`${theirLabel}이라면 뭐라고 했을까요`, `${theirLabel}이라면 뭐라고 했을까`)}"
        onkeydown="if(event.key==='Enter') ${fn}(this.value)">
      <button class="btn btn-primary btn-block" onclick="${fn}(document.getElementById('${kind}-input').value)">${kind === 'self' ? '다음' : '이걸로'}</button>`;
  }

  // 내 예상이 맞았는지: 자동 비교로 맞았거나, 상대가 '맞은 걸로' 인정했으면 정답
  function hitOf(guesser, saved) {
    const owner = guesser === 'parent' ? 'child' : 'parent';
    if (!saved[`${owner}_self`] || !saved[`${guesser}_guess`]) return null;
    return close(saved[`${guesser}_guess`], saved[`${owner}_self`]) || !!saved[`${owner}_ok`];
  }

  function render() {
    const saved = getSaved();
    document.getElementById('q-text').textContent = q.q;
    document.getElementById('foot-note').textContent = tone('질문은 3일마다 바뀌어요.', '질문은 3일마다 바뀌어.');
    const ui = document.getElementById('step-ui');
    const mySelf = saved[`${myRole}_self`], myGuess = saved[`${myRole}_guess`];
    const theirSelf = saved[`${theirRole}_self`], theirGuess = saved[`${theirRole}_guess`];

    if (!mySelf) {
      renderStepper(1);
      document.getElementById('q-sub').textContent = tone('먼저 내 답부터', '먼저 내 답부터');
      ui.innerHTML = inputUI('self');
      return;
    }
    if (!myGuess) {
      renderStepper(2);
      document.getElementById('q-sub').textContent = tone(`${theirLabel}은(는) 뭐라고 했을까요?`, `${theirLabel}은 뭐라고 했을까?`);
      ui.innerHTML = `<div class="kv"><small>내 답</small><b>${esc(mySelf)}</b></div>` + inputUI('guess');
      return;
    }
    renderStepper(3);
    document.getElementById('q-sub').textContent = '결과';
    const myHit = hitOf(myRole, saved), theirHit = hitOf(theirRole, saved);

    let html = `
      <div class="guess-pair">
        <div class="kv"><small>내가 예상한 ${theirLabel}의 답</small><b>${esc(myGuess)}</b></div>
        ${theirSelf ? `<div class="kv dark"><small>${theirLabel}의 진짜 답</small><b>${esc(theirSelf)}</b></div>` : ''}
      </div>`;
    if (!theirSelf) {
      html += `<div class="waiting">${KyncBrand.curled(40)}<span><b>${tone(`${theirLabel}이(가) 아직 안 했어요`, `${theirLabel}이 아직 안 했어`)}</b>${tone('하면 바로 결과가 떠요.', '하면 바로 결과 떠.')}</span></div>`;
    } else {
      html += `<div class="verdict ${myHit ? 'same' : 'diff'}">${KyncBrand.mascot(myHit ? 'happy' : 'wow', 40, { shadow: false })}
        ${myHit ? tone('맞혔어요', '맞혔다') : tone('틀렸어요. 하나 알게 됐네요', '틀렸다. 하나 알게 됐네')}</div>`;
    }
    // 상대가 예상한 내 답 (내가 정답 인정 가능)
    if (theirGuess) {
      const auto = close(theirGuess, mySelf);
      html += `
        <div class="kv"><small>${theirLabel}이(가) 예상한 내 답</small><b>${esc(theirGuess)}</b>
          <span class="kv-foot">내 답: ${esc(mySelf)}${auto ? ` · <b class="ok">맞음</b>` : saved[`${myRole}_ok`]
            ? ` · <b class="ok">맞은 걸로 해줌</b> <button class="text-btn" onclick="put({ ${myRole}_ok: false })">취소</button>`
            : ` · <button class="text-btn ok-btn" onclick="put({ ${myRole}_ok: true })">${tone('이 정도면 맞은 걸로', '이 정도면 맞은 걸로')}</button>`}</span>
        </div>`;
    } else if (theirSelf) {
      html += `<p class="small sub center">${tone(`${theirLabel}이(가) 내 답을 맞히는 중이에요.`, `${theirLabel}이 내 답 맞히는 중.`)}</p>`;
    }
    if (myHit !== null && theirHit !== null) {
      const n = (myHit ? 1 : 0) + (theirHit ? 1 : 0);
      html += `<div class="score-line">${n === 2 ? tone('둘 다 맞혔어요', '둘 다 맞힘') : n === 1 ? tone('한 명만 맞혔어요', '한 명만 맞힘') : tone('둘 다 틀렸어요', '둘 다 틀림')}</div>`;
    }
    ui.innerHTML = html;
  }

  function answerSelf(answer) {
    if (!answer?.trim()) { toast(tone('답을 써주세요', '답 써줘'), 'error'); return; }
    put({ [`${myRole}_self`]: answer.trim() });
  }
  function answerGuess(answer) {
    if (!answer?.trim()) { toast(tone('예상한 답을 써주세요', '예상한 답 써줘'), 'error'); return; }
    put({ [`${myRole}_guess`]: answer.trim() });
  }

  render();

  // 상대 답 실시간 반영
  if (familyCode !== 'local') {
    KyncAuth.ready().then(user => {
      if (!user) { location.href = 'index.html'; return; }
      db.collection('families').doc(familyCode).collection('together_quiz').doc(storageKey)
        .onSnapshot(snap => {
          if (!snap.exists) return;
          localStorage.setItem(storageKey, JSON.stringify({ ...getSaved(), ...snap.data() }));
          render();
        }, e => console.warn('quiz listen:', e));
    });
  }
</script>
</body>
</html>
