<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Kync — 서로 맞히기</title>
  <meta name="theme-color" content="#F4F1EC" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="kync.css?v=20261013-2" />
</head>
<body>
<div class="sub-app">
  <header class="sub-head">
    <button class="icon-btn" onclick="goBack()" aria-label="활동으로 돌아가기"><span data-ic="back"></span></button>
    <h1>서로 맞히기</h1>
  </header>
  <main class="sub-body">
    <div class="stepper" id="stepper" aria-label="진행 단계"></div>
    <div class="dark-card">
      <div class="q-label" id="q-sub"></div>
      <p class="q-text" id="q-text"></p>
    </div>
    <div id="step-ui" class="stack"></div>
    <p class="small muted center">질문은 3일마다 바뀌어요.</p>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="kync-ui.js?v=20261013-2"></script>
<script src="firebase-system.js?v=20261013-2"></script>
<script src="kync-features.js?v=20261013-2"></script>
<script>
  const myRole = localStorage.getItem('kync_role') || 'parent';
  const familyCode = localStorage.getItem('kync_family_code') || 'local';
  const weekKey = `w${Math.floor(localDayNum() / 7)}`;
  const qIdx = Math.floor(localDayNum() / 3) % KyncTogether.QUIZ_Q.length;
  const q = KyncTogether.QUIZ_Q[qIdx];
  const storageKey = `kync_quiz_${familyCode}_${weekKey}_${qIdx}`;
  const theirLabel = myRole === 'parent' ? '자녀' : '부모님';
  const esc = KyncUI.esc;
  // 비교할 때 띄어쓰기 차이 무시
  const same = (a, b) => String(a ?? '').replace(/\s+/g, '') === String(b ?? '').replace(/\s+/g, '');

  function goBack() {
    location.href = `index.html?tab=${myRole === 'parent' ? 'p-activityTab' : 'c-activityTab'}`;
  }
  function getSaved() {
    try { return JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (e) { return {}; }
  }

  async function saveToFirestore(data) {
    if (familyCode === 'local') return;
    try {
      await db.collection('families').doc(familyCode).collection('together_quiz').doc(storageKey).set(data, { merge: true });
    } catch (e) { toast('저장하지 못했어요. 인터넷 연결을 확인해주세요.', 'error'); }
  }

  function renderStepper(step) {
    const labels = ['내 답', `${theirLabel} 맞히기`, '결과'];
    document.getElementById('stepper').innerHTML = labels.map((l, i) => {
      const n = i + 1, cls = n < step ? 'done' : n === step ? 'on' : '';
      return `${i ? '<span class="line"></span>' : ''}<span class="s ${cls}"><i>${n < step ? ic('check', 13) : n}</i>${l}</span>`;
    }).join('');
  }

  function inputUI(kind) {
    const fn = kind === 'self' ? 'answerSelf' : 'answerGuess';
    if (q.opts) {
      return `<div class="opt-list">${q.opts.map((o, i) =>
        `<button class="opt-item" data-opt="${esc(o)}" onclick="${fn}(this.dataset.opt)"><span class="n">${i + 1}</span>${esc(o)}</button>`).join('')}</div>`;
    }
    return `<input id="${kind}-input" class="input" type="text" maxlength="20" aria-label="답"
        placeholder="${kind === 'self' ? '솔직하게 답해봐요' : `${theirLabel}의 답을 예상해봐요`}"
        onkeydown="if(event.key==='Enter') ${fn}(this.value)">
      <button class="btn btn-primary btn-block" onclick="${fn}(document.getElementById('${kind}-input').value)">${kind === 'self' ? '내 답 저장하기' : '예상 저장하기'}</button>`;
  }

  function render() {
    const saved = getSaved();
    const myKey = `${myRole}_self`, guessKey = `${myRole}_guess`;
    const theirKey = `${myRole === 'parent' ? 'child' : 'parent'}_self`;
    document.getElementById('q-text').textContent = q.q;
    const ui = document.getElementById('step-ui');

    if (!saved[myKey]) {
      renderStepper(1);
      document.getElementById('q-sub').textContent = '나에 대한 질문';
      ui.innerHTML = inputUI('self');
    } else if (!saved[guessKey]) {
      renderStepper(2);
      document.getElementById('q-sub').textContent = `${theirLabel}이(가) 뭐라고 답했을까?`;
      ui.innerHTML = `<div class="kv"><small>내 답</small><b>${esc(saved[myKey])}</b></div>` + inputUI('guess');
    } else {
      renderStepper(3);
      document.getElementById('q-sub').textContent = '결과';
      const theirSelf = saved[theirKey];
      const hit = theirSelf && same(saved[guessKey], theirSelf);
      ui.innerHTML = `
        <div class="kv"><small>내 답</small><b>${esc(saved[myKey])}</b></div>
        <div class="kv"><small>내가 예상한 ${theirLabel}의 답</small><b>${esc(saved[guessKey])}</b></div>
        ${theirSelf ? `
          <div class="kv dark"><small>${theirLabel}의 실제 답</small><b>${esc(theirSelf)}</b></div>
          <div class="verdict ${hit ? 'same' : 'diff'}">${KyncBrand.mascot(hit ? 'happy' : 'wow', 40, { shadow: false })}
            ${hit ? '맞혔어요. 잘 알고 있었네요' : '틀렸지만, 이제 하나 더 알게 됐어요'}</div>` : `
          <div class="waiting">${KyncBrand.curled(40)}<span><b>${theirLabel}의 답을 기다리는 중</b>${theirLabel}이(가) 답하면 결과가 열려요.</span></div>`}`;
    }
  }

  async function answerSelf(answer) {
    if (!answer?.trim()) { toast('답을 입력해주세요.', 'error'); return; }
    const saved = getSaved();
    saved[`${myRole}_self`] = answer.trim();
    localStorage.setItem(storageKey, JSON.stringify(saved));
    render();
    await saveToFirestore({ [`${myRole}_self`]: answer.trim() });
  }

  async function answerGuess(answer) {
    if (!answer?.trim()) { toast('예상한 답을 입력해주세요.', 'error'); return; }
    const saved = getSaved();
    saved[`${myRole}_guess`] = answer.trim();
    localStorage.setItem(storageKey, JSON.stringify(saved));
    render();
    await saveToFirestore({ [`${myRole}_guess`]: answer.trim() });
  }

  render();

  // 상대 답 실시간 반영
  if (familyCode !== 'local') {
    KyncAuth.ready().then(user => {
      if (!user) { location.href = 'index.html'; return; }
      db.collection('families').doc(familyCode).collection('together_quiz').doc(storageKey)
        .onSnapshot(snap => {
          if (!snap.exists) return;
          localStorage.setItem(storageKey, JSON.stringify({ ...getSaved(), ...snap.data() }));
          render();
        }, e => console.warn('quiz listen:', e));
    });
  }
</script>
</body>
</html>
