<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Kync — 취향 맞추기</title>
  <meta name="theme-color" content="#F4F1EC" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="kync.css?v=20261019-1" />
</head>
<body>
<div class="sub-app">
  <header class="sub-head">
    <button class="icon-btn" onclick="goBack()" aria-label="활동으로 돌아가기"><span data-ic="back"></span></button>
    <h1>취향 맞추기</h1>
  </header>
  <main class="sub-body">
    <div class="sub-intro">
      <h2>서로 취향 알아보기</h2>
      <p id="intro-sub"></p>
    </div>
    <section class="card tight">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <span class="small sub" style="font-weight:700">오늘</span>
        <b class="num" id="prog-count">0 / 10</b>
      </div>
      <div class="bar"><div id="prog-fill" style="width:0%"></div></div>
    </section>
    <div id="done-banner" class="done-card hidden">
      <span data-mascot="happy" data-size="52" data-noshadow></span>
      <div><b id="done-title"></b><small id="done-sub"></small></div>
    </div>
    <div class="stack" style="gap:8px" id="q-list"></div>
  </main>
</div>

<!-- 질문 풀기 -->
<div class="full-layer" id="question-screen" role="dialog" aria-modal="true">
  <div>
    <header class="sub-head">
      <button class="icon-btn" onclick="closeQuestion()" aria-label="목록으로"><span data-ic="back"></span></button>
      <h1 id="qs-title">취향 맞추기</h1>
    </header>
    <div class="sub-body">
      <div class="dark-card">
        <div class="q-label">나는?</div>
        <p class="q-text" id="qs-q-text"></p>
      </div>
      <div class="opt-row" id="qs-opts"></div>
    </div>
  </div>
</div>

<!-- 답한 뒤 -->
<div class="full-layer" id="result-screen" role="dialog" aria-modal="true">
  <div>
    <div class="sub-body" style="justify-content:center;text-align:center;padding-top:60px">
      <div id="result-art" style="display:flex;justify-content:center"></div>
      <h2 id="result-title"></h2>
      <div class="kv dark" style="text-align:left"><small>내 선택</small><b id="result-my-val"></b></div>
      <p class="small sub" id="result-hint"></p>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-soft grow" onclick="closeResult()">목록으로</button>
        <button class="btn btn-primary grow" id="btn-next-q" onclick="nextQuestion()">다음 질문</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="kync-ui.js?v=20261019-1"></script>
<script src="firebase-system.js?v=20261019-1"></script>
<script src="kync-balance.js?v=20261019-1"></script>
<script>
  const myRole = localStorage.getItem('kync_role') || 'parent';
  const familyCode = localStorage.getItem('kync_family_code') || 'local';
  const MAX = KyncBalance.MAX_PER_DAY;
  let currentQId = null;
  let theirAnswers = {}; // 상대가 오늘 고른 답 { 질문id: 답 }
  const theirLabel = myRole === 'parent' ? '자녀' : '부모님';
  const esc = KyncUI.esc;

  function goBack() {
    location.href = `index.html?tab=${myRole === 'parent' ? 'p-activityTab' : 'c-activityTab'}`;
  }

  function renderList() {
    const { data } = KyncBalance._getTodayState(familyCode);
    const todaysQs = KyncBalance._getTodaysQuestions();
    const answered = Object.keys(data.answers).length;

    document.getElementById('prog-count').textContent = `${answered} / ${MAX}`;
    document.getElementById('prog-fill').style.width = `${(answered / MAX) * 100}%`;
    document.getElementById('done-banner').classList.toggle('hidden', answered < MAX);

    document.getElementById('q-list').innerHTML = todaysQs.map((q, idx) => {
      const mine = data.answers[q.id];
      if (mine) {
        return `<div class="tq-item done"><span class="n">${ic('check', 14)}</span>
          <div class="grow"><b>${esc(q.q)}</b><small>${compareText(mine, theirAnswers[q.id])}</small></div></div>`;
      }
      return `<button class="tq-item" onclick="openQuestion(${q.id})"><span class="n">${idx + 1}</span>
        <div class="grow"><b>${esc(q.q)}</b></div><span class="chev">${ic('chev', 18)}</span></button>`;
    }).join('');
  }

  // 내 답과 상대 답 비교 (내가 답한 뒤에만 상대 답 공개)
  function compareText(mine, theirs) {
    if (!theirs) return `나 ${esc(mine)} · ${theirLabel} 아직`;
    return `나 ${esc(mine)} · ${theirLabel} ${esc(theirs)} · ${mine === theirs ? '같음' : '다름'}`;
  }

  function openQuestion(qId) {
    const q = KyncBalance.QUESTIONS.find(q => q.id === qId);
    if (!q) return;
    currentQId = qId;
    document.getElementById('qs-q-text').textContent = q.q;
    document.getElementById('qs-opts').innerHTML = q.opts.map(o =>
      `<button class="opt-big" data-opt="${esc(o)}" onclick="submitAnswer(this.dataset.opt)">${esc(o)}</button>`).join('');
    document.getElementById('question-screen').classList.add('active');
  }
  function closeQuestion() { document.getElementById('question-screen').classList.remove('active'); }

  async function submitAnswer(answer) {
    const { key, data } = KyncBalance._getTodayState(familyCode);
    if (data.answers[currentQId]) return;
    data.answers[currentQId] = answer;
    data.count = Object.keys(data.answers).length;
    KyncBalance._saveTodayState(key, data);

    closeQuestion();
    showResult(answer, currentQId);
    renderList();

    if (familyCode !== 'local') {
      try {
        const today = new Date().toLocaleDateString('ko-KR');
        await db.collection('families').doc(familyCode).collection('balance_answers')
          .doc(`${today}_${myRole}_${currentQId}`)
          .set({ role: myRole, qId: currentQId, answer, day: today, answeredAt: firebase.firestore.FieldValue.serverTimestamp() });
      } catch (e) { toast(tone('저장하지 못했어요. 인터넷 연결을 확인해주세요.', '저장 못 했어. 인터넷 연결 확인해줘'), 'error'); }
    }
  }

  function showResult(answer, qId) {
    const theirs = theirAnswers[qId];
    document.getElementById('result-my-val').textContent = answer;
    document.getElementById('result-art').innerHTML = theirs ? KyncBrand.mascot(theirs === answer ? 'happy' : 'wow', 96) : KyncBrand.curled(90);
    document.getElementById('result-title').textContent = theirs ? (theirs === answer ? tone('같은 취향이에요', '같은 취향') : tone('달랐어요', '달랐다')) : tone('골랐어요', '골랐어');
    document.getElementById('result-hint').textContent = theirs
      ? tone(`${theirLabel}은(는) “${theirs}”`, `${theirLabel}은 “${theirs}”`)
      : tone(`${theirLabel}이(가) 고르면 같이 보여요.`, `${theirLabel}이 고르면 같이 보여.`);
    const { data } = KyncBalance._getTodayState(familyCode);
    document.getElementById('btn-next-q').classList.toggle('hidden', Object.keys(data.answers).length >= MAX);
    document.getElementById('result-screen').classList.add('active');
  }
  function closeResult() { document.getElementById('result-screen').classList.remove('active'); }

  function nextQuestion() {
    closeResult();
    const { data } = KyncBalance._getTodayState(familyCode);
    const next = KyncBalance._getTodaysQuestions().find(q => !data.answers[q.id]);
    if (next) openQuestion(next.id);
  }

  document.getElementById('intro-sub').textContent = tone('하루 10문제. 내가 고르고 나면 상대가 뭘 골랐는지 보여요.', '하루 10문제. 내가 고르고 나면 상대가 뭘 골랐는지 보여.');
  document.getElementById('done-title').textContent = '오늘 10문제 끝';
  document.getElementById('done-sub').textContent = tone('내일 새 문제가 나와요.', '내일 새 문제 나와.');
  renderList();

  // 상대의 오늘 답을 실시간으로 불러와 비교
  if (familyCode !== 'local') {
    KyncAuth.ready().then(user => {
      if (!user) { location.href = 'index.html'; return; }
      const today = new Date().toLocaleDateString('ko-KR');
      const prefix = `${today}_${myRole === 'parent' ? 'child' : 'parent'}_`;
      db.collection('families').doc(familyCode).collection('balance_answers')
        .orderBy(firebase.firestore.FieldPath.documentId())
        .startAt(prefix).endAt(prefix + '')
        .onSnapshot(snap => {
          theirAnswers = {};
          snap.forEach(d => { const v = d.data(); theirAnswers[v.qId] = v.answer; });
          renderList();
        }, e => console.warn('balance answers listen:', e));
    });
  }
</script>
</body>
</html>
